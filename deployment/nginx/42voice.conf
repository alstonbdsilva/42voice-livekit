# ==============================================================================
# Host-Level Nginx Configuration Example for 42Voice
# 
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/42voice.conf on your VPS server.
#   2. Create a symlink in /etc/nginx/sites-enabled/:
#      sudo ln -s /etc/nginx/sites-available/42voice.conf /etc/nginx/sites-enabled/
#   3. Verify syntax: sudo nginx -t
#   4. Reload Nginx:   sudo systemctl reload nginx
#
# Note: Existing server blocks for logos.42voice.com and reception.42voice.com
#       in /etc/nginx remain unaffected.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Frontend Dashboard (dashboard.42voice.com)
# Proxying to Docker container fe (127.0.0.1:8080)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name dashboard.42voice.com;

    # SSL configuration managed by Certbot / Host Nginx
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/dashboard.42voice.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dashboard.42voice.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. FastAPI REST Backend API (api.42voice.com)
# Proxying to Docker container backend (127.0.0.1:8000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.42voice.com;

    # SSL configuration managed by Certbot / Host Nginx
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/api.42voice.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.42voice.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. LiveKit SFU WebRTC / WebSocket Signaling (ws.42voice.com)
# Proxying to Docker container livekit (127.0.0.1:7880)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ws.42voice.com;

    # SSL configuration managed by Certbot / Host Nginx
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/ws.42voice.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ws.42voice.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        
        # WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long Timeouts suitable for persistent LiveKit WebRTC WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
