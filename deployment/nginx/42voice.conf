# ==============================================================================
# Host-Level Nginx Configuration for 42Voice (HTTP & HTTPS SSL)
# 
# Installation on VPS:
#   1. Copy to /etc/nginx/sites-available/42voice.conf
#   2. Symlink: sudo ln -sf /etc/nginx/sites-available/42voice.conf /etc/nginx/sites-enabled/
#   3. Run Certbot for SSL: sudo certbot --nginx -d dashboard.42voice.com -d api.42voice.com -d ws.42voice.com
#   4. Test & Reload: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Frontend Web Dashboard (dashboard.42voice.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name dashboard.42voice.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.42voice.com;

    # Certbot SSL paths (auto-managed by certbot)
    ssl_certificate /etc/letsencrypt/live/dashboard.42voice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.42voice.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. FastAPI REST Backend API (api.42voice.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.42voice.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.42voice.com;

    # Certbot SSL paths (auto-managed by certbot)
    ssl_certificate /etc/letsencrypt/live/api.42voice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.42voice.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. LiveKit SFU WebRTC / WebSocket Server (ws.42voice.com)
# CRITICAL: Must proxy / to http://127.0.0.1:7880 with WebSocket Upgrade headers!
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ws.42voice.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ws.42voice.com;

    # Certbot SSL paths (auto-managed by certbot)
    ssl_certificate /etc/letsencrypt/live/ws.42voice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.42voice.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        
        # WebSocket Upgrade Headers (Required for LiveKit WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Persistent timeouts for LiveKit WebRTC WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
