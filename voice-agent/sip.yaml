# LiveKit SIP Configuration
# This file configures the LiveKit SIP connector for Twilio integration

sip_port: 5060
sip_address: 0.0.0.0

# NAT configuration
nat_external_ip: ""  # Set to your public IP if behind NAT
nat_port_mapping: {}

# Twilio SIP Trunking Configuration
sip_trunk:
  enabled: true
  username: ""  # Optional: Twilio SIP username (if using SIP auth)
  password: ""  # Optional: Twilio SIP password (if using SIP auth)
  account_sid: ""  # Twilio Account SID
  auth_token: ""  # Twilio Auth Token
  phone_number: ""  # Twilio Phone Number
  trunk_id: ""  # Twilio SIP Trunk ID
  
# LiveKit connection
livekit:
  url: wss://ws.42voice.com
  api_key: devkey
  api_secret: secret

# Room configuration
room:
  prefix: "sip-"  # Prefix for SIP rooms
  create_if_not_exists: true
  empty_timeout: 300  # Seconds before empty room is deleted

# Audio configuration
audio:
  sample_rate: 8000  # 8kHz for telephony
  channels: 1
  frame_duration: 20  # ms

# Logging
log_level: info
