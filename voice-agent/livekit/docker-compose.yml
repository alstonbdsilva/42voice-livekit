services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.13.3
    command: --config /etc/livekit.yaml
    # network_mode: host # Uncomment for Linux/EC2 production deployment
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.13.0
    # network_mode: host # Uncomment for Linux/EC2 production deployment
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /livekit/egress.yaml
    ports:
      - "7980:7980"
    volumes:
      - ./egress.yaml:/livekit/egress.yaml
      - ./recordings:/recordings
    depends_on:
      - redis

