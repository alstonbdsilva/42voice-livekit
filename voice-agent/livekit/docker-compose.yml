# ==============================================================================
# LOCAL DEV STACK for LiveKit + SIP + Egress.
# NOT the production stack - see the root docker-compose.yml (canonical).
# Credentials come from the environment (LIVEKIT_API_KEY / LIVEKIT_API_SECRET).
# The dev Redis runs without a password.
# ==============================================================================
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        redis:
          address: redis:6379
        rtc:
          tcp_port: 7881
          port_range_start: 10000
          port_range_end: 20000
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis

  sip:
    image: livekit/sip:v1.1.0
    restart: unless-stopped
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
    depends_on:
      - redis
      - livekit

  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
        api_secret: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        template_port: 7980
    ports:
      - "7980:7980"
    volumes:
      - ./recordings:/recordings
    depends_on:
      - redis