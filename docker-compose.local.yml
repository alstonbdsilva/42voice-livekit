services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret}
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    networks:
      - app-network

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - app-network

  backend:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./entrypoint.sh", "backend"]
    env_file:
      - .env.local
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_PUBLIC_URL=ws://localhost:7880
      - BACKEND_URL=http://localhost:8000/api/v1
    ports:
      - "8000:8000"
    networks:
      - app-network

  voice-agent:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["./entrypoint.sh", "worker"]
    env_file:
      - .env.local
    environment:
      - ENVIRONMENT=development
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - BACKEND_URL=http://backend:8000/api/v1
    networks:
      - app-network

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000/api/v1
        REACT_APP_LIVEKIT_URL: ws://localhost:7880
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - app-network

volumes:
  redis_local_data:

networks:
  app-network:
    driver: bridge
